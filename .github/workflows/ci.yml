name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (single source of truth)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the gate harness
        run: ./scripts/verify.sh

  # Decides whether `e2e` runs. A separate job because `actions/checkout` defaults
  # to depth 1 and a diff needs history — `fetch-depth: 0` is paid once here rather
  # than on the job that is about to skip.
  #
  # This is an ALLOWLIST of inert paths, and that direction is the whole point. A
  # path nobody anticipated runs the suite instead of skipping it, so a new
  # directory cannot silently lose coverage — only the patterns named below can
  # skip, and adding to them is a deliberate edit.
  #
  # `bench/**` IS NOT INERT, and this is where the port source's list would have
  # been wrong for us. PDX-002's scenario reads the imported measurement tree
  # directly: it walks the graft merge's second parent for author dates, derives
  # round-two membership from the run ids in `bench/data/runs/`, and asserts one
  # environment fingerprint across every acceptance record. A change under
  # `bench/` is precisely the change that scenario exists to catch, so it runs
  # the suite.
  #
  # `README.md` is not inert either: PDX-002 asserts its Status section. Nothing
  # under `docs/**` is read by a scenario today — verified by grepping
  # `tests/e2e/` for `docs` — so it is the one documentation path that may skip.
  # A future scenario that parses `docs/` has to take it off this list or it
  # loses its gate without anyone noticing.
  #
  # `LICENSE` is deliberately absent: it is a legal artifact, and a change to it
  # is exactly the kind that should not slip through on a skipped suite.
  changed:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.classify.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `git diff` against the PR base, not a third-party action. The diff is two
      # lines of shell and adds no supply-chain surface to a workflow that can see
      # the repository.
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          decide() {
            echo "verdict: run_e2e=$1 — $2"
            echo "run_e2e=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # main is the branch releases are cut from, and a merge commit's diff is
          # not the pull request's diff. e2e always runs there.
          [ "$EVENT" = "pull_request" ] || decide true "event is '$EVENT', not a pull request"

          FILES="$(git diff --name-only "$BASE...$HEAD" 2>/dev/null)" || FILES=""

          # An empty or uncomputable diff falls back to running. Skipping is the
          # only outcome that can lose coverage, so it is never the fallback.
          [ -n "$FILES" ] || decide true "no diff computed against '$BASE' — refusing to skip"

          echo "changed files:"
          echo "$FILES" | sed 's/^/  /'

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*.md) ;;
              .docs/*) ;;
              *) decide true "'$f' is not on the inert allowlist" ;;
            esac
          done <<< "$FILES"

          decide false "every changed file is on the inert allowlist"

  # A SEPARATE job, not a tenth gate inside verify.sh.
  #
  # verify.sh is what a contributor runs locally before every commit and it has
  # to stay fast enough to keep being run at all. The e2e suite is a different
  # animal: it walks git history, builds the workspace, and will drive a real
  # browser once the catalogue lands (PDX-004+). Folding it in would make the
  # local gate one nobody runs, and CI would gain nothing it does not already get
  # from a job running in parallel.
  #
  # As its own job it runs concurrently with `verify` (wall time is
  # max(verify, changed + e2e), not the sum) and fails the check independently —
  # so a red scenario is attributable at a glance instead of hiding behind a
  # `verify` failure.
  #
  # Scenarios are NOT parallelized inside the job. `scripts/e2e.sh` runs them
  # serially and exits non-zero if any one fails, which is exactly the contract
  # this job needs — so there is one runner, not a matrix.
  e2e:
    needs: changed
    # Skipped via `if:`, which GitHub reports as a skipped job rather than a
    # failure. `main` carries no branch protection today, so no required check is
    # waiting on this; if protection is ever added with `e2e` required, confirm
    # the skip still satisfies it before trusting this line.
    if: needs.changed.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    # A backstop against a scenario that hangs, not an expected duration.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # PDX-002's scenario reads the imported history through the graft merge's
        # second parent. The default depth-1 checkout has no second parent to
        # read, so the scenario would fail on CI while passing locally.
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # PDX-002's AC-3 loads the built package from packages/data/dist to prove the
      # loader refuses an unfingerprinted record. This job does not run verify.sh, so
      # nothing else builds it — without this step the scenario fails on CI while
      # passing locally, where dist/ is left over from the last verify run.
      - name: Build the workspace
        run: pnpm build
      # PDX-003's AC-5 runs a real `claude plugin marketplace add` + `claude plugin
      # install`, because the product's premise is that the hub installs and an
      # assertion that stops at manifest syntax does not test that. The CLI is not on
      # the runner, and the scenario deliberately FAILS rather than skips when it is
      # absent — a skip would leave the premise unproven while the run stayed green.
      # The install itself needs no credentials: it clones the pack's public repository
      # and writes into a scratch CLAUDE_CONFIG_DIR the scenario creates.
      - name: Install the Claude Code CLI (PDX-003 AC-5 needs a real install)
        run: npm install -g @anthropic-ai/claude-code
      # The browser driver is NOT installed here yet. The catalogue lands with
      # PDX-004, and until a scenario actually drives a browser, installing one
      # is two minutes of runner time per PR buying nothing. The step returns
      # with the first UI scenario, pinned, and the ticket that adds it is the
      # ticket that adds this back.
      - name: Run the e2e regression
        # No ticket argument = regression mode over every tests/e2e/*.sh.
        run: ./scripts/e2e.sh
